schema: spec-driven

context: |
  Tech stack: Go, Terraform Plugin Framework (no SDKv2).
  Domain: Terraform provider for Elastic Cloud (hosted deployments, serverless projects, traffic filters, extensions).
  Requirements: Canonical specs live in openspec/specs/. Authoring conventions: dev-docs/high-level/openspec-requirements.md.
  Constraints:
  - No local Docker stack. Hosted ESS via cloud-sdk-go; serverless via the generated client under ec/internal/gen/serverless/.
  - Agents never run acceptance tests (TF_ACC). Acc hits the paid Elastic Cloud API and runs on Buildkite. Specs may mention acc as a human step; they MUST NOT require make testacc.
  - User-facing implementation PRs add .changelog/{PR}.txt. Spec/docs-only PRs skip it.
  - Capability ids are kebab-case without the ec_ Terraform type prefix (e.g. deployment-traffic-filter).
  - Do not put unimplemented behavior into openspec/specs/. New or changed behavior goes in openspec/changes/ and is archived after it lands.

rules:
  proposal:
    - State why the change is needed and what is out of scope.
    - Name capabilities by kebab-case id without the ec_ prefix.
  specs:
    - Each requirement uses SHALL or MUST (RFC 2119).
    - Each requirement has Given / When / Then scenarios.
    - Requirements describe Terraform / API-contract behavior, not a line-by-line Go transcription.
    - Agents never run TF_ACC; do not require make testacc in a scenario.
  design:
    - Call out Plugin Framework (not SDKv2) and which client (cloud-sdk-go vs generated serverless).
  tasks:
    - Separate unit-test tasks from out-of-band human/Buildkite acceptance tests.
    - Never instruct an agent to run make testacc or TF_ACC=1.

operations:
  apply:
    guidance:
      - Run make lint, make build, and make unit. Never run make testacc or set TF_ACC.
      - User-facing implementation needs .changelog/{PR}.txt; spec/docs-only PRs skip it.
  archive:
    guidance:
      - Sync delta specs into openspec/specs/ before or as part of archive.
      - Do not archive unimplemented behavior into canonical specs.

githubCopilot:
  cloudAgent: false
