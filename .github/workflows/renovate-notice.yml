name: Update generated files for Renovate PRs

# Regenerates NOTICE and the generated serverless client on Renovate dependency
# PRs and commits the result onto the PR branch.
#
# Why both? go.yml has two drift checks that Renovate cannot satisfy on its own:
#   - `make notice` must match the dependency graph in go.mod/go.sum.
#   - `make gen` must match the pinned generator versions: oapi-codegen stamps
#     its own version into ec/internal/gen/serverless/client.gen.go, so every
#     github.com/oapi-codegen/oapi-codegen/v2 bump (and any output change in the
#     hashicorp tfplugingen generators) fails the "serverless client is
#     up-to-date" check until someone commits the regenerated output.
#
# Why a Vault-minted token instead of the default GITHUB_TOKEN?
# A push authenticated with the default GITHUB_TOKEN does NOT re-trigger required
# checks (GitHub's anti-recursion rule), so the fix-up commit would leave the PR
# stuck on stale checks and block automerge. This workflow mints a short-lived,
# contents:write-scoped token via Vault OIDC (elastic/ci-gh-actions/fetch-github-token);
# a commit made with it is treated like a normal actor and DOES re-trigger checks.
#
# Trust model — read this before changing the job layout.
# `make notice` and `make gen` execute third-party code at whatever versions the
# Renovate PR pins (go-licence-detector, go-licenser, oapi-codegen, mockgen, the
# tfplugingen generators) plus the golangci-lint installer that `make
# license-header` pulls in. That code must never run in a job that can obtain a
# write token. Inside a single job it always could: with `id-token: write` the
# OIDC request URL/token are in every step's environment, so any process can
# mint the same Vault token itself, and any step can poison later steps through
# GITHUB_PATH / GITHUB_ENV. Only a job boundary isolates those. Hence two jobs:
#   - `regen`  — contents:read, NO id-token. Runs the generators and uploads the
#                staged diff as an artifact. Cannot push anywhere.
#   - `commit` — id-token:write, contents:read. Runs no Renovate-pinned code:
#                only checkout, artifact download, git apply, jq, gh and the
#                fetch-github-token action (which downloads the Vault CLI from
#                releases.hashicorp.com, the same trust every consumer of that
#                action accepts). It treats the patch as hostile data: it must
#                apply onto exactly the commit it was made from, every staged
#                entry must be a regular non-executable file add/modify/delete
#                inside NOTICE or ec/internal/gen/serverless (no symlinks,
#                executables, submodules or typechanges), and file contents are
#                read from the index, never from the worktree, so nothing can be
#                smuggled through a link.
# What this does NOT protect against: the regenerated bytes under those two
# paths are generator output and are trusted as such. A malicious generator
# release can put anything there (now including Go source: client.gen.go,
# mocks, framework schema code); go.yml re-validates with the same generator
# version, approve-renovate.yml auto-approves Renovate PRs that have auto-merge
# on, and renovate.json enables auto-merge for every non-major bump. So on a
# minor/patch bump of a generator there is NO human review of the regenerated
# source before it merges. The lever for that is renovate.json (e.g. no
# automerge for the oapi-codegen and hashicorp groups), not this workflow.
#
# Token scope: the TokenPolicy grants `contents: write` on the whole repository
# (installation tokens cannot be branch-scoped; only branch protection and
# rulesets limit what the token can push to) and is `cached`, so Vault returns
# a shared token with no lease: it cannot be revoked early and lives to its TTL.
#
# This replaces the abandoned Renovate `postUpgradeTasks` approach, which required
# allowlisting `make notice` in elastic/renovate-workflows-base — frozen by InfoSec.
#
# Prerequisite: the Vault TokenPolicy `token-policy-terraform-provider-ec-notice`
# (elastic/catalog-info) must be merged and realized. Its OIDC bound claim pins
# this workflow to `.github/workflows/renovate-notice.yml@refs/pull/*/merge`
# (pull_request events run on the merge ref), so the file path and the
# pull_request trigger below must not change. The Vault role name is derived
# from the workflow path alone, which is exactly why the regen job must not
# have id-token permission. Note that the bound claim does not distinguish
# authors: any pull_request from a branch in this repo runs that branch's copy
# of this file, so a write collaborator could edit it to mint the token. The
# `if:` guards below select Renovate's PRs; they are not a security boundary.
# Fork PRs cannot be granted `id-token: write` (write-class permissions stay
# read-only from forks).
#
# Follows the elastic/mcp-gateway reference workflow
# (.github/workflows/renovate-helm-docs.yml) in committing through the GitHub API
# rather than `git push`, so the commit is verified and authored as the vault bot
# with no hardcoded git identity. It uses the GraphQL `createCommitOnBranch`
# mutation instead of the REST Contents API because the regenerated output spans
# several files (NOTICE, client.gen.go, mocks, framework schema code): one
# mutation yields one verified commit and one re-trigger, where per-file Contents
# API PUTs would produce one commit per file, each re-triggering (and, via the
# concurrency group below, cancelling) this workflow mid-run.
#
# Known cosmetic effect: the bot commit re-triggers this workflow while the
# committing run is still in its post-steps, so that run shows as cancelled. The
# commit is already on the branch by then; the re-triggered run is skipped by
# the regen job's `if:` (sender is the vault bot).

on:
  pull_request:
    # Only dependency PRs affect NOTICE and the pinned generator versions, so
    # scope to go module changes.
    paths:
      - go.mod
      - go.sum
    types: [opened, synchronize, reopened]

# One regen run per PR at a time; a newer push supersedes the older run.
concurrency:
  group: renovate-notice-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# No workflow-level grants; each job declares exactly what it needs.
permissions: {}

jobs:
  regen:
    name: Regenerate generated files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only act on Renovate's own PRs, and not on the synchronize event raised by
    # this workflow's own commit: that run would regenerate to identical output
    # and exit anyway, but skipping it also bounds the damage if a generator
    # ever produces non-deterministic output (go.yml would go red; without this
    # guard the bot would commit on every run, forever).
    if: >-
      github.event.pull_request.user.login == 'elastic-renovate-prod[bot]' &&
      github.event.sender.login != 'elastic-vault-github-plugin-prod[bot]'
    # This job runs Renovate-pinned third-party tool code. It must have no write
    # capability and no id-token permission (see the trust model above).
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      base: ${{ steps.diff.outputs.base }}
    steps:
      # Renovate branches live in this repo, so the default read-only GITHUB_TOKEN
      # is enough to check them out. Do not persist it into .git/config either.
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      # Regenerate the same way the required go.yml checks do: tidy with this repo's
      # Go toolchain (so our NOTICE can't diverge from what CI recomputes if Renovate's
      # tidy differs), then `make notice` and `make gen`. `make notice` builds
      # go-licence-detector on demand via the go.mod tool directive; `make gen` runs
      # `go generate ./...` (tfplugingen-openapi, tfplugingen-framework, oapi-codegen,
      # mockgen) and then re-applies license headers, exactly like the
      # "Check serverless client is up-to-date" step.
      - name: Regenerate NOTICE and serverless client
        run: |
          go mod download
          go mod tidy
          make notice
          make gen

      # Stage only the two paths the go.yml checks diff, so new or deleted
      # generated files are included, and hand the staged diff to the commit job
      # as a binary patch. `base` lets the commit job refuse to apply it to a
      # branch that moved in the meantime.
      - name: Collect changes as a patch
        id: diff
        run: |
          set -o pipefail
          git add -A -- NOTICE ec/internal/gen/serverless
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "NOTICE and generated serverless client are up-to-date, nothing to commit"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          git diff --cached --name-status --no-renames
          git diff --cached --binary --no-renames > "$RUNNER_TEMP/regen.patch"

      - name: Upload patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regen-patch
          path: ${{ runner.temp }}/regen.patch
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit generated files
    needs: regen
    if: needs.regen.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can mint the write token. It runs no third-party tool
    # code: checkout, artifact download, git apply, jq, gh.
    permissions:
      id-token: write # required for Vault OIDC auth to mint the ephemeral token
      contents: read  # the write happens via the Vault-minted token, not GITHUB_TOKEN
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Download patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: regen-patch
          path: ${{ runner.temp }}

      # The patch was produced by a job that ran untrusted tool code, so treat it
      # as hostile data. It must apply onto exactly the commit it was made from,
      # and every staged entry must be a regular non-executable file add, modify
      # or delete inside the two committed paths. Symlinks (120000), executables
      # (100755), submodules (160000) and typechanges are refused: createCommitOnBranch
      # cannot represent them anyway, and a symlink inside the allowed directory
      # would otherwise let the commit step read arbitrary files (e.g.
      # /proc/self/environ) through it. All of this runs before any token exists.
      - name: Apply and validate patch
        env:
          BASE: ${{ needs.regen.outputs.base }}
        run: |
          set -o pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$BASE" ]; then
            echo "::error::Branch moved from $BASE to $head since the patch was generated;" \
                 "the run triggered by that push supersedes this one."
            exit 1
          fi
          git apply --index --binary "$RUNNER_TEMP/regen.patch"

          # --raw -z: ":<srcmode> <dstmode> <srcsha> <dstsha> <status>\0<path>\0"
          git diff --cached --raw --no-renames -z > "$RUNNER_TEMP/staged.raw"
          : > "$RUNNER_TEMP/additions.z"
          : > "$RUNNER_TEMP/deletions.z"
          n=0
          while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
            read -r srcmode dstmode _ _ status <<< "${meta#:}"
            if ! [[ "$path" =~ ^(NOTICE|ec/internal/gen/serverless/[^[:cntrl:]]+)$ ]]; then
              echo "::error::Patch touches a path outside NOTICE and ec/internal/gen/serverless; refusing to commit: $path"
              exit 1
            fi
            case "$status:$srcmode:$dstmode" in
              A:000000:100644|M:100644:100644) printf '%s\0' "$path" >> "$RUNNER_TEMP/additions.z" ;;
              D:100644:000000)                 printf '%s\0' "$path" >> "$RUNNER_TEMP/deletions.z" ;;
              *)
                echo "::error::Refusing staged entry that is not a regular non-executable file add/modify/delete:" \
                     "$status $srcmode->$dstmode $path"
                exit 1 ;;
            esac
            n=$((n + 1))
          done < "$RUNNER_TEMP/staged.raw"
          if [ "$n" -eq 0 ]; then
            echo "::error::Nothing staged after applying the patch; the regen job said there were changes."
            exit 1
          fi
          echo "Changed files:"
          git diff --cached --name-status --no-renames

      # Mint the GitHub token from Vault via the workflow's own OIDC identity.
      # Scope (contents:write on this repo, cached/shared, see "Token scope"
      # above) is defined by the TokenPolicy, not here. Only this job has
      # id-token permission, and only after the patch has been validated.
      - name: Fetch ephemeral GitHub token
        id: fetch-token
        uses: elastic/ci-gh-actions/fetch-github-token@2feb1c6f5086cf8e06f61ef35e275abed3456f7b # v1.5.3
        with:
          vault-instance: "ci-prod"

      - name: Commit regenerated files
        env:
          GH_TOKEN: ${{ steps.fetch-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -o pipefail
          # Commit via the GraphQL createCommitOnBranch mutation (not git commit/push)
          # so GitHub marks it as a verified commit. Verified bot signatures only apply
          # to API-created commits with no custom author/committer info, and this
          # mutation accepts none — GitHub authors the commit as the vault bot
          # (150874479+elastic-vault-github-plugin-prod[bot]@users.noreply.github.com),
          # which is exactly the identity `gitIgnoredAuthors` in renovate.json lists.
          # Only the paths validated by the previous step are sent, and their
          # contents come from the index (`git cat-file blob :path`), never from the
          # worktree. File contents go through files (--rawfile/--slurpfile), never
          # argv, so a large regenerated client cannot hit ARG_MAX.
          work="$(mktemp -d)"
          : > "$work/additions.jsonl"
          while IFS= read -r -d '' path; do
            git cat-file blob ":$path" | base64 -w0 > "$work/blob"
            jq -n --arg path "$path" --rawfile contents "$work/blob" \
              '{path: $path, contents: $contents}' >> "$work/additions.jsonl"
          done < "$RUNNER_TEMP/additions.z"
          while IFS= read -r -d '' path; do
            jq -n --arg path "$path" '{path: $path}'
          done < "$RUNNER_TEMP/deletions.z" > "$work/deletions.jsonl"
          git diff --cached --name-status --no-renames > "$work/changed.txt"

          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$HEAD_REF" \
            --arg head "$(git rev-parse HEAD)" \
            --arg headline "Update generated files for dependency changes" \
            --rawfile body "$work/changed.txt" \
            --slurpfile additions "$work/additions.jsonl" \
            --slurpfile deletions "$work/deletions.jsonl" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $head,
                message: { headline: $headline, body: ("Regenerated by renovate-notice.yml:\n\n" + $body) },
                fileChanges: { additions: $additions, deletions: $deletions }
              } }
            }' > "$work/request.json"

          gh api graphql --input "$work/request.json" --jq '.data.createCommitOnBranch.commit.url'
          # The API commit re-triggers this workflow with the vault bot as sender;
          # the regen job's `if:` skips that run, and even without it the run
          # would find everything up-to-date and exit without minting a token.
