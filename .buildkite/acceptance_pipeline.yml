steps:
  - label: ":test_tube: Acceptance tests"
    key: "acceptance-tests"
    command: .buildkite/acceptance.sh
    agents:
      image: "docker.io/library/golang:1.27"
      cpu: "8"
      # Sized for TEST_ACC_PARALLEL in build/Makefile.test (one Terraform CLI per running test).
      memory: "8G"
